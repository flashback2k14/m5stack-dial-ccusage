; PlatformIO-Projekt fuer das M5Stack Dial v1.1 (Stamp-S3A / ESP32-S3)
; --------------------------------------------------------------------------
; Build:   pio run
; Flashen: pio run -t upload
; Monitor: pio device monitor

[env:m5dial]
platform = espressif32
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
upload_speed = 1500000

build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; ESP32-S3 mit 8MB Flash und PSRAM-freier Konfiguration des Dials.
    -DBOARD_HAS_PSRAM

board_build.partitions = default_8MB.csv

lib_deps =
    m5stack/M5Dial@^1.0.3
    m5stack/M5Unified@^0.2.7
    m5stack/M5GFX@^0.2.7
    bblanchon/ArduinoJson@^7.2.0
